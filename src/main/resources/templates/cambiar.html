<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modificar Individuo</title>
    <link rel="stylesheet" href="/CSS/modificar-individuo.css">
</head>
<body>

<main>
    <h1>Modificar Individuo</h1>

    <a th:href="@{/}" class="btn">Regresar</a>

    <form th:action="@{/salvar}" method="post" th:object="${individuo}" class="formulario">
        <input type="hidden" th:field="*{id_individuo}">

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" th:field="*{nombre}" id="nombre" required>
            <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Campo obligatorio</span>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" th:field="*{apellido}" id="apellido" required>
            <span class="error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}">Campo obligatorio</span>
        </div>

        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" th:field="*{edad}" id="edad" min="0" required>
            <span class="error" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}">Campo obligatorio</span>
        </div>

        <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" th:field="*{correo}" id="correo" required>
            <span class="error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}">Campo obligatorio</span>
        </div>

        <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input type="tel" th:field="*{telefono}" id="telefono" required>
            <span class="error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}">Campo obligatorio</span>
        </div>

        <div class="form-actions">
            <input type="submit" class="btn" value="Modificar">
        </div>
    </form>
</main>

</body>
</html>
