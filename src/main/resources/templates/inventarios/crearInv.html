<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Optimization Baseline - Crear Inventario</title>
    <link rel="stylesheet" th:href="@{/CSS/INVENTARIO/crearInv.css}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div class="app-container">
    <!-- ✅ Sidebar igual que dashboard -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img th:src="@{/IMG/imagen-bob.png}" alt="BOB Logo">
            <h1>BOB</h1>
        </div>
        <ul class="nav-links">
            <!-- Admin-only menu items -->
            <div sec:authorize="hasRole('ADMIN')">
                <li><a th:href="@{/redirigir}"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-users-cog"></i> <span>Gestión de Usuarios</span></a></li>
            </div>

            <!-- Menu items for users with inventory permissions -->
            <div sec:authorize="hasAnyAuthority('VER_INVENTARIO', 'CREAR_INVENTARIO', 'EDITAR_INVENTARIO')">
                <li><a th:href="@{/inventario/inventario}"><i class="fas fa-box"></i> <span>Inventario</span></a></li>
            </div>

            <div sec:authorize="hasAnyAuthority('CREAR_APU', 'EDITAR_APU', 'VER_APU')">
                <li><a th:href="@{/apu/inicioAPU}"><i class="fas fa-calculator"></i> <span>Gestión de APUs</span></a></li>
            </div>

            <!-- Menu items for users with progress permissions -->
            <div sec:authorize="hasAnyAuthority('VER_AVANCES', 'REGISTRAR_AVANCES')">
                <li><a th:href="@{/avances/inicioAvances}"><i class="fas fa-hard-hat"></i> <span>Avances</span></a></li>
            </div>

            <!-- Menu items for users with budget permissions -->
            <div sec:authorize="hasAnyAuthority('VER_OBRAS', 'GESTIONAR_OBRAS','LEER OBRAS')">
                <li><a th:href="@{/obras/inicioObra}"><i class="fas fa-money-bill-wave"></i> <span>Obras</span></a></li>
            </div>

            <!-- Supervisor and Admin menu items -->
            <div sec:authorize="hasAnyRole('SUPERVISOR', 'ADMIN')">
                <li><a th:href="@{/contratista/contratista}"><i class="fas fa-handshake"></i> <span>Contratistas</span></a></li>
                <li><a th:href="@{/proveedores/inicioProveedor}"><i class="fas fa-truck-loading"></i> <span>Proveedores</span></a></li>
            </div>

            <!-- Menu items for users with report permissions
            <div sec:authorize="hasAnyAuthority('VER_REPORTES', 'GENERAR_REPORTES')">
              <li><a href="#"><i class="fas fa-chart-line"></i> <span>Reportes</span></a></li>
            </div>

             Admin-only configuration
            <div sec:authorize="hasRole('ADMIN')">
              <li><a href="#"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
            </div>
                -->
            <li>
                <form th:action="@{/logout}" method="post" id="logoutForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <a href="#" onclick="document.getElementById('logoutForm').submit()">
                        <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
                    </a>
                </form>
            </li>
        </ul>
    </aside>

    <!-- ✅ Contenido principal -->
    <main class="main-content">
        <div class="header">
            <h2>Crear Inventario</h2>
        </div>
        <div class="dashboard-content">

            <div class="form-container">
                <div class="form-header">
                    <h1>Agregar Inventario</h1>
                </div>

                <div class="form-content">
                    <form th:action="@{/inventario/guardarInv}" method="post" th:object="${inventario}">
                        <input type="hidden" th:field="*{idUsuario.idUsuario}" />

                        <div class="form-group">
                            <label>Usuario Actual:</label>
                            <input type="text" th:value="${usuario.nombreUsuario}" readonly class="readonly-field">
                        </div>

                        <div class="form-group">
                            <label>Nombre Obra:</label>
                            <select th:field="*{idObra}" class="form-select" required>
                                <option value="">Seleccione una obra...</option>
                                <option th:each="obra : ${obras}"
                                        th:value="${obra.idObra}"
                                        th:text="${obra.nombreObra}"></option>
                            </select>
                            <span class="error-message" th:if="${#fields.hasErrors('idObra')}" th:errors="*{idObra}"></span>
                        </div>

                        <div class="form-group">
                            <label>Fecha:</label>
                            <input type="date" id="fecha" th:field="*{fechaIngreso}">
                        </div>

                        <div class="form-group">
                            <label>Observaciones:</label>
                            <input type="text" th:field="*{unidadInv}">
                        </div>

                        <!-- 📌 Materiales -->
                        <div class="materials-section">
                            <h3><i class='bx bx-list-plus'></i> Materiales</h3>
                            <div class="material-items" id="materialItems">
                                <div class="material-item">
                                    <div class="form-group">
                                        <label>Material:</label>
                                        <select name="materialIds" class="material-select">
                                            <option value="">-- Seleccionar Material --</option>
                                            <option th:each="material : ${materiales}"
                                                    th:value="${material.idMaterial}"
                                                    th:text="${material.nombreMaterial}"></option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Cantidad:</label>
                                        <input type="number" name="materialCantidades" class="material-quantity" placeholder="Ingrese cantidad" min="0" step="0.01">
                                    </div>
                                    <button type="button" class="btn-remove-material" onclick="removeMaterial(this)">
                                        <i class='bx bx-trash'></i> Eliminar
                                    </button>
                                </div>
                            </div>
                            <button type="button" class="btn-add-material" onclick="addMaterial()">
                                <i class='bx bx-plus'></i> Agregar otro material
                            </button>
                        </div>

                        <div class="submit-btn">
                            <input type="submit" value="Guardar">
                        </div>
                        <br>
                        <div>
                            <a th:href="@{/inventario/inventario}" class="back-link">
                                <i class='bx bx-arrow-back'></i> Regresar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const hoy = new Date().toISOString().split("T")[0];
        const inputFecha = document.getElementById("fecha");
        inputFecha.setAttribute("min", hoy);
        inputFecha.setAttribute("max", hoy);
        inputFecha.value = hoy;
    });

    function addMaterial() {
        const materialItems = document.getElementById('materialItems');
        const newMaterialItem = materialItems.firstElementChild.cloneNode(true);
        newMaterialItem.querySelector('.material-select').value = '';
        newMaterialItem.querySelector('.material-quantity').value = '';
        materialItems.appendChild(newMaterialItem);
    }

    function removeMaterial(button) {
        const materialItems = document.getElementById('materialItems');
        if (materialItems.children.length > 1) {
            button.closest('.material-item').remove();
        }
    }
</script>

</body>
</html>
