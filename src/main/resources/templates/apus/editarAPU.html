<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${apu.idAPU != null} ? 'Editar APU' : 'Crear APU'">APU</title>
    <link rel="stylesheet" th:href="@{/CSS/dashboard.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .form-card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:1.25rem;margin-bottom:1.5rem}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        .grid-1{display:grid;grid-template-columns:1fr;gap:1rem}
        .form-group{margin-bottom:1rem}
        label{font-weight:600;display:block;margin-bottom:.5rem;color:#334155}
        input, textarea, select{width:100%;padding:.7rem;border:1px solid #e2e8f0;border-radius:8px;font-size:1rem;box-sizing:border-box}
        input:focus, textarea:focus, select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
        textarea{min-height:110px;resize:vertical}
        .actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.5rem;flex-wrap:wrap}
        .btn{padding:.7rem 1.5rem;border:none;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:500;transition:all .3s}
        .btn-primary{background:#3b82f6;color:#fff}
        .btn-primary:hover{background:#2563eb}
        .btn-secondary{background:#64748b;color:#fff}
        .btn-secondary:hover{background:#475569}
        .page-header{margin-bottom:1.5rem}
        .page-header h2{color:#1e293b;font-size:1.75rem;font-weight:600;margin:0}
    </style>
</head>
<body>
<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img th:src="@{/IMG/imagen-bob.png}" alt="BOB Logo">
            <h1>BOB</h1>
        </div>
        <ul class="nav-links">
            <div sec:authorize="hasRole('ADMIN')">
                <li><a th:href="@{/dashboard}"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-users-cog"></i> <span>Gestión de Usuarios</span></a></li>
            </div>
            <div sec:authorize="hasAnyAuthority('VER_INVENTARIO','CREAR_INVENTARIO','EDITAR_INVENTARIO')">
                <li><a th:href="@{/inventario}"><i class="fas fa-box"></i> <span>Inventario</span></a></li>
            </div>
            <div sec:authorize="hasAnyAuthority('CREAR_APU','EDITAR_APU','VER_APU')">
                <li><a th:href="@{/apu/inicioAPU}" class="active"><i class="fas fa-calculator"></i> <span>Gestión de APUs</span></a></li>
            </div>
            <div sec:authorize="hasAnyAuthority('VER_AVANCES','REGISTRAR_AVANCES')">
                <li><a th:href="@{/avances/inicioAvances}"><i class="fas fa-hard-hat"></i> <span>Avances</span></a></li>
            </div>
            <div sec:authorize="hasAnyAuthority('VER_OBRAS','GESTIONAR_OBRAS','LEER_OBRAS')">
                <li><a th:href="@{/obras/inicioObra}"><i class="fas fa-money-bill-wave"></i> <span>Obras</span></a></li>
            </div>
            <div sec:authorize="hasAnyRole('SUPERVISOR','ADMIN')">
                <li><a th:href="@{/contratista}"><i class="fas fa-handshake"></i> <span>Contratistas</span></a></li>
            </div>
            <div sec:authorize="hasAnyRole('SUPERVISOR','ADMIN')">
                <li><a th:href="@{/proveedores/inicioProveedor}"><i class="fas fa-truck-loading"></i> <span>Proveedores</span></a></li>
            </div>
            <li>
                <form th:action="@{/logout}" method="post" id="logoutForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <a href="#" onclick="document.getElementById('logoutForm').submit()">
                        <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
                    </a>
                </form>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Header -->
        <header class="content-header">
            <div class="page-header">
                <h2 th:text="${apu.idAPU != null} ? 'Editar APU' : 'Crear APU'">Editar APU</h2>
            </div>
        </header>

        <!-- Formulario -->
        <div class="form-card">
            <form th:action="@{/apu/actualizar}" th:object="${apu}" method="post">

                <!-- Campo oculto para el ID -->
                <input type="hidden" th:field="*{idAPU}" />

                <div class="grid-2">
                    <!-- Código APU -->
                    <div class="form-group">
                        <label for="codigoAPU">Código APU *</label>
                        <input type="text" id="codigoAPU" th:field="*{codigoAPU}" required placeholder="Ej: APU-001">
                    </div>

                    <!-- Descripción -->
                    <div class="form-group">
                        <label for="descripcionAPU">Descripción *</label>
                        <input type="text" id="descripcionAPU" th:field="*{descripcionAPU}" required placeholder="Descripción del APU">
                    </div>
                </div>

                <div class="grid-2">
                    <!-- Unidad -->
                    <div class="form-group">
                        <label for="unidadAPU">Unidad *</label>
                        <input type="text" id="unidadAPU" th:field="*{unidadAPU}" required placeholder="Ej: m2, m3, unidad">
                    </div>

                    <!-- Cantidad -->
                    <div class="form-group">
                        <label for="cantidadAPU">Cantidad *</label>
                        <input type="number" step="0.01" id="cantidadAPU" th:field="*{cantidadAPU}" required placeholder="0.00">
                    </div>
                </div>

                <div class="grid-2">
                    <!-- Valor Materiales -->
                    <div class="form-group">
                        <label for="vMaterialesAPU">Valor Materiales</label>
                        <input type="number" step="0.01" id="vMaterialesAPU" th:field="*{vMaterialesAPU}" placeholder="0.00">
                    </div>

                    <!-- Valor Mano de Obra -->
                    <div class="form-group">
                        <label for="vManoDeObraAPU">Valor Mano de Obra</label>
                        <input type="number" step="0.01" id="vManoDeObraAPU" th:field="*{vManoDeObraAPU}" placeholder="0.00">
                    </div>
                </div>

                <div class="grid-1">
                    <!-- Valor Transporte -->
                    <div class="form-group">
                        <label for="vTransporteAPU">Valor Transporte</label>
                        <input type="number" step="0.01" id="vTransporteAPU" th:field="*{vTransporteAPU}" placeholder="0.00">
                    </div>
                </div>

                <!-- Botones de acción -->
                <div class="actions">
                    <a th:href="@{/apu/inicioAPU}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
