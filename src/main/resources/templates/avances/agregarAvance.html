<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <link rel="stylesheet" th:href="@{/CSS/agregarAvance.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <img th:src="@{/IMG/imagen-bob.png}" alt="BOB Logo">
            <h1>BOB</h1>
        </div>
        <ul class="nav-links">
            <!-- Admin-only menu items -->
            <div sec:authorize="hasRole('ADMIN')">
                <li><a th:href="@{/redirigir}"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a></li>
                <li><a th:href="@{/usuarios}"><i class="fas fa-users-cog"></i> <span>Gestión de Usuarios</span></a></li>
            </div>

            <!-- Menu items for users with inventory permissions -->
            <div sec:authorize="hasAnyAuthority('VER_INVENTARIO', 'CREAR_INVENTARIO', 'EDITAR_INVENTARIO')">
                <li><a th:href="@{/inventario/inventario}"><i class="fas fa-box"></i> <span>Inventario</span></a></li>
            </div>

            <div sec:authorize="hasAnyAuthority('CREAR_APU', 'EDITAR_APU', 'VER_APU')">
                <li><a th:href="@{/apu/inicioAPU}"><i class="fas fa-calculator"></i> <span>Gestión de APUs</span></a></li>
            </div>

            <!-- Menu items for users with progress permissions -->
            <div sec:authorize="hasAnyAuthority('VER_AVANCES', 'REGISTRAR_AVANCES')">
                <li><a th:href="@{/avances/inicioAvances}"><i class="fas fa-hard-hat"></i> <span>Avances</span></a></li>
            </div>

            <!-- Menu items for users with budget permissions -->
            <div sec:authorize="hasAnyAuthority('VER_OBRAS', 'GESTIONAR_OBRAS','LEER OBRAS')">
                <li><a th:href="@{/obras/inicioObra}"><i class="fas fa-money-bill-wave"></i> <span>Obras</span></a></li>
            </div>

            <!-- Supervisor and Admin menu items -->
            <div sec:authorize="hasAnyRole('SUPERVISOR', 'ADMIN')">
                <li><a th:href="@{/contratista/contratista}"><i class="fas fa-handshake"></i> <span>Contratistas</span></a></li>
                <li><a href="#"><i class="fas fa-truck-loading"></i> <span>Proveedores</span></a></li>
            </div>

            <!-- Menu items for users with report permissions
            <div sec:authorize="hasAnyAuthority('VER_REPORTES', 'GENERAR_REPORTES')">
              <li><a href="#"><i class="fas fa-chart-line"></i> <span>Reportes</span></a></li>
            </div>

             Admin-only configuration
            <div sec:authorize="hasRole('ADMIN')">
              <li><a href="#"><i class="fas fa-cog"></i> <span>Configuración</span></a></li>
            </div>
                -->
            <li>
                <form th:action="@{/logout}" method="post" id="logoutForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <a href="#" onclick="document.getElementById('logoutForm').submit()">
                        <i class="fas fa-sign-out-alt"></i> <span>Cerrar Sesión</span>
                    </a>
                </form>
            </li>
        </ul>
    </aside>

    <div class="main-content">
        <div class="header">
            <h2>Agregar Avances</h2>
        </div>

        <main>
            <!-- Back button -->
            <a th:href="@{/avances/inicioAvances}" class="btn">Regresar</a>
            <br><br>

            <!-- Create Form (now the only form) -->
            <form th:action="@{/avances/salvar}" method="post" th:object="${avance}" id="avanceForm">

                <!-- Work Name Input -->
                <div>
                    <label><b>Nombre de la obra:</b></label>
                    <select id="obraDropdown" name="idObra" required>
                        <option value="">Seleccione...</option>
                        <option th:each="pre : ${presupuestos}"
                                th:value="${pre.id_obra}"
                                th:data-activities="${pre.activiValues != null ? #strings.listJoin(pre.activiValues.keySet(), ',') : ''}"
                                th:text="${pre.obraName}">
                        </option>
                    </select>
                </div>

                <div>
                    <label><b>Fecha:</b></label>
                    <input type="date" name="fecha" required>
                </div>

                <h3>Actividad:</h3>

                <!-- Single dropdown for selection -->
                <div>
                    <select id="activityDropdown" name="idMatriz" required disabled>
                        <option value="">Debe seleccionar una obra</option>
                        <!--<option th:each="mat : ${matriz}"
                                th:value="${mat.id_m}"
                                th:data-nombre="${mat.nombre}"
                                th:data-unidades="${mat.unidades}"
                                th:text="${mat.nombre} + ' (' + mat.unidades + ')'">
                        </option>-->
                    </select>

                    <input type="number" id="inputcantidad" name="cantidad" step="0.01" min="0.01"
                           placeholder="Cantidad" class="quantity-input">

                </div>
                <!-- Container for selected
                <div id="selectedActivity"> -->
                <!-- Selected activity will appear here -->
    <!-- Hidden inputs that will be submitted -->
    <div id="hiddenInputs">
        <input type="hidden" name="idUsuario" value="4">
        <!-- Hidden input for user ID (you might want to set this from session) -->
        <!-- Hidden input for user ID (you might want to set this from session) -->
        <!-- Hidden input for user ID (you might want to set this from session) -->
        <!-- Hidden input for user ID (you might want to set this from session) -->
    </div>

    <!-- Submit Button -->
    <button type="submit" class="btn">Guardar</button>
    </form>
        </main>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const obraDropdown = document.getElementById('obraDropdown');
        const activityDropdown = document.getElementById('activityDropdown');
        const allMatriz = /*[[${matriz}]]*/ [];

        // Create a map of all available activities for quick lookup
        const matrizMap = new Map();
        allMatriz.forEach(mat => {
            matrizMap.set(mat.id_m, mat);
        });

        obraDropdown.addEventListener('change', function() {
            const selectedObraId = this.value;
            activityDropdown.innerHTML = '<option value="">Seleccione...</option>';
            activityDropdown.disabled = true;

            if (!selectedObraId) return;

            // Get the selected option
            const selectedOption = this.options[this.selectedIndex];
            // Get the activities IDs from data-attribute
            const activityIdsString = selectedOption.getAttribute('data-activities');

            if (activityIdsString && activityIdsString.trim() !== '') {
                const activityIds = activityIdsString.split(',');

                // Populate the activities dropdown
                activityIds.forEach(id => {
                    const numericId = parseInt(id.trim());
                    if (!isNaN(numericId)) {
                        const mat = matrizMap.get(numericId);
                        if (mat) {
                            const option = document.createElement('option');
                            option.value = mat.id_m;
                            option.textContent = `${mat.nombre} (${mat.unidades})`;
                            activityDropdown.appendChild(option);
                        }
                    }
                });

                activityDropdown.disabled = false;
            } else {
                console.log('No activities found for this work');
            }
        });
    });
</script>
</body>
</html>
